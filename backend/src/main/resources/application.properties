spring.application.name=fitness-franchise-backend
server.port=8080

# Connexion PostgreSQL - Fitness Franchise
spring.datasource.url=jdbc:postgresql://localhost:5432/fitness_franchise
spring.datasource.username=fitness_app
spring.datasource.password=${DB_PASSWORD}

# Configuration JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# W01: real PostgreSQL account adapter; schema must be applied before startup.
fitness.auth.enabled=true
